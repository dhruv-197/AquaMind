name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build

  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    env:
      AQUAMIND_ENVIRONMENT: test
      JWT_SECRET_KEY: ci-test-only-secret-not-for-deployment
      DATABASE_URL: sqlite:///./aquamind_ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fastapi_app/requirements.txt
          pip install -r ai/requirements.txt
      - name: Run tests
        run: python -m pytest fastapi_app/tests -q
